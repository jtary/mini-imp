[package]
name = "mini-imp"
version = "0.1.0"
edition = "2024"
description = "N-up imposition of PDFs and images for Windows printing"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "tiff", "bmp", "webp", "gif"] }
lopdf = "0.45.0"
pdfium-render = "0.9.4"
rfd = "0.17.2"
windows = { version = "0.62.2", features = ["Win32_Graphics_Gdi", "Win32_UI_Controls_Dialogs", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Security"] }
